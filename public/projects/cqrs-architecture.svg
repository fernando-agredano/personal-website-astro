<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0edbab; letter-spacing: 0.08em; }
      .box-lbl { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: rgba(240,240,240,0.75); font-weight: 600; }
      .sub-lbl { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: rgba(240,240,240,0.4); font-weight: 500; }
      .line { stroke: rgba(240,240,240,0.22); stroke-width: 1.5; fill: none; }
      .accline { stroke: rgba(14,219,171,0.55); stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="800" height="450" fill="#050505" />
  <text x="40" y="40" class="lbl" font-size="11">CQRS + EVENT-DRIVEN</text>

  <!-- Commands column -->
  <rect x="70" y="80" width="180" height="60" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
  <text x="160" y="115" text-anchor="middle" class="box-lbl" font-size="14">Commands</text>

  <!-- Queries column -->
  <rect x="70" y="300" width="180" height="60" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
  <text x="160" y="335" text-anchor="middle" class="box-lbl" font-size="14">Queries</text>

  <!-- Postgres -->
  <rect x="340" y="190" width="180" height="70" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" />
  <text x="430" y="222" text-anchor="middle" class="box-lbl" font-size="14">PostgreSQL</text>
  <text x="430" y="242" text-anchor="middle" class="sub-lbl" font-size="10">items · movements · log</text>

  <!-- Event Bus -->
  <rect x="340" y="60" width="180" height="60" rx="12" fill="rgba(14,219,171,0.08)" stroke="rgba(14,219,171,0.55)" />
  <text x="430" y="95" text-anchor="middle" class="box-lbl" font-size="14" fill="#0edbab">Event Bus</text>

  <!-- Handlers -->
  <rect x="590" y="20" width="150" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" />
  <text x="665" y="46" text-anchor="middle" class="sub-lbl" font-size="11">Stock Alert</text>

  <rect x="590" y="70" width="150" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" />
  <text x="665" y="96" text-anchor="middle" class="sub-lbl" font-size="11">Audit Log</text>

  <rect x="590" y="120" width="150" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" />
  <text x="665" y="146" text-anchor="middle" class="sub-lbl" font-size="11">Event Log</text>

  <!-- connectors -->
  <path d="M 250 110 L 340 95" class="line" />
  <path d="M 250 130 L 340 225" class="line" />
  <path d="M 250 330 L 340 225" class="line" />
  <path d="M 520 91 L 590 41" class="accline" />
  <path d="M 520 91 L 590 91" class="accline" />
  <path d="M 520 91 L 590 141" class="accline" />

  <text x="40" y="420" class="sub-lbl" font-size="11">Fastify · inventory system · commands mutate, queries read, events fan out</text>
</svg>
