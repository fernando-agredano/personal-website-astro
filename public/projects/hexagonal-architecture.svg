<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0edbab; letter-spacing: 0.08em; }
      .box-lbl { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: rgba(240,240,240,0.75); font-weight: 600; }
      .sub-lbl { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: rgba(240,240,240,0.4); font-weight: 500; }
      .core-lbl { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #0edbab; font-weight: 700; }
      .spoke { stroke: rgba(14,219,171,0.4); stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="800" height="450" fill="#050505" />
  <text x="40" y="40" class="lbl" font-size="11">HEXAGONAL · PORTS &amp; ADAPTERS</text>

  <!-- spokes from center to adapters -->
  <line x1="400" y1="225" x2="150" y2="90" class="spoke" />
  <line x1="400" y1="225" x2="150" y2="360" class="spoke" />
  <line x1="400" y1="225" x2="650" y2="90" class="spoke" />
  <line x1="400" y1="225" x2="650" y2="225" class="spoke" />
  <line x1="400" y1="225" x2="650" y2="360" class="spoke" />

  <!-- hexagon core -->
  <polygon points="400,140 470,180 470,265 400,310 330,265 330,180"
    fill="rgba(14,219,171,0.08)" stroke="rgba(14,219,171,0.6)" stroke-width="2" />
  <text x="400" y="220" text-anchor="middle" class="core-lbl" font-size="14">DOMAIN</text>
  <text x="400" y="238" text-anchor="middle" class="sub-lbl" font-size="9">ports · zero deps</text>

  <!-- adapters -->
  <rect x="60" y="60" width="180" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
  <text x="150" y="94" text-anchor="middle" class="box-lbl" font-size="12">Flask HTTP</text>

  <rect x="60" y="332" width="180" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
  <text x="150" y="366" text-anchor="middle" class="box-lbl" font-size="12">PostgreSQL Repo</text>

  <rect x="560" y="60" width="180" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
  <text x="650" y="94" text-anchor="middle" class="box-lbl" font-size="12">Email Sender</text>

  <rect x="560" y="197" width="180" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
  <text x="650" y="231" text-anchor="middle" class="box-lbl" font-size="12">SMS Sender</text>

  <rect x="560" y="332" width="180" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
  <text x="650" y="366" text-anchor="middle" class="box-lbl" font-size="12">In-App Sender</text>

  <text x="40" y="420" class="sub-lbl" font-size="11">Flask · notifications service · swap adapters without touching domain</text>
</svg>
