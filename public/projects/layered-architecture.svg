<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0edbab; letter-spacing: 0.08em; }
      .box-lbl { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: rgba(240,240,240,0.8); font-weight: 600; }
      .sub-lbl { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: rgba(240,240,240,0.4); font-weight: 500; }
    </style>
  </defs>

  <rect width="800" height="450" fill="#050505" />
  <text x="40" y="40" class="lbl" font-size="11">LAYERED / N-TIER</text>

  <!-- 4 stacked layers -->
  <rect x="90" y="60" width="480" height="72" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
  <text x="115" y="90" class="box-lbl" font-size="15">Routes</text>
  <text x="115" y="110" class="sub-lbl" font-size="11">FastAPI · Pydantic validation</text>

  <rect x="90" y="146" width="480" height="72" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
  <text x="115" y="176" class="box-lbl" font-size="15">Services</text>
  <text x="115" y="196" class="sub-lbl" font-size="11">auth &amp; task business logic</text>

  <rect x="90" y="232" width="480" height="72" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
  <text x="115" y="262" class="box-lbl" font-size="15">Repositories</text>
  <text x="115" y="282" class="sub-lbl" font-size="11">query &amp; persistence access</text>

  <rect x="90" y="318" width="480" height="72" rx="12" fill="rgba(14,219,171,0.08)" stroke="rgba(14,219,171,0.55)" />
  <text x="115" y="348" class="box-lbl" font-size="15" fill="#0edbab">Models</text>
  <text x="115" y="368" class="sub-lbl" font-size="11">SQLAlchemy · PostgreSQL</text>

  <!-- request flow arrow -->
  <line x1="640" y1="70" x2="640" y2="370" stroke="rgba(14,219,171,0.55)" stroke-width="1.5" />
  <path d="M 640 370 L 633 355 L 647 355 Z" fill="rgba(14,219,171,0.7)" />
  <text x="660" y="225" class="lbl" font-size="10" transform="rotate(90 660 225)" text-anchor="middle">REQUEST FLOW</text>

  <text x="40" y="420" class="sub-lbl" font-size="11">FastAPI · task manager · JWT auth, priorities &amp; status</text>
</svg>
